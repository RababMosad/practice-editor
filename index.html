  if (all) {
    if (!solved(i.status)) { i.status = 'Solved'; i.solvedAt = today(); }
    html += `<p class="msg" style="color:var(--ok)">${pk.sol ? 'ممتاز! لكنك اطلعتِ على الحل، فأعيدي كتابته من الذاكرة غداً.' : 'أحسنتِ! حدّدي ثقتك أسفل الصفحة ليحسب الشيت موعد المراجعة.'}</p>`;
  } else if (i.status === 'Not started') i.status = 'Attempted';
  box.innerHTML = html;
  renderList(); syncTrack();
  i.last = { lang, pass, total };
}

/* ====================== أسفل الصفحة ====================== */
function updateMeta() {
  const i = it(cur), el = $('#meta'); if (!el) return;
  el.textContent = 'محاولات: ' + (i.attempts || 0) + (i.solvedAt ? ' • حُلّت في ' + i.solvedAt : '');
}
function syncTrack() {
  const i = it(cur);
  document.querySelectorAll('#stSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.s === i.status)));
  document.querySelectorAll('#confSeg button').forEach((b) => b.setAttribute('aria-pressed', String(String(i.conf) === b.dataset.c)));
  updateMeta(); updateTimerUI();
}

/* ====================== الأحداث ====================== */
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); }
function dialog(title, text, readOnly, onOk, okLabel) {
  const ov = $('#overlay');
  ov.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><div><h2 style="margin:0;font-size:17px">${esc(title)}</h2><textarea id="dlgTx" ${readOnly ? 'readonly' : ''} spellcheck="false">${esc(text)}</textarea><div class="row"><button class="btn primary" id="dlgOk">${esc(okLabel || 'تم')}</button><button class="btn ghost" id="dlgNo">إغلاق</button></div></div></div>`;
  const tx = $('#dlgTx'); if (readOnly) { tx.focus(); tx.select(); }
  $('#dlgNo').onclick = () => { ov.innerHTML = ''; };
  $('#dlgOk').onclick = () => { const v = tx.value; if (onOk) { if (onOk(v) === false) return; } ov.innerHTML = ''; };
}
async function copyText(t) { try { await navigator.clipboard.writeText(t); return true; } catch (e) { return false; } }

function sheetTsv() {
  return P.map((p) => { const i = it(p.id); return [i.status, i.attempts || 0, Math.round((i.secs || 0) / 60), i.solvedAt || '', i.conf || ''].join('\t'); }).join('\n');
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.matches('#list .item')) { openProblem(+t.dataset.id); return; }
  if (t.id === 'menuBtn') { $('#side').classList.add('open'); return; }
  if (t.id === 'sideClose') { $('#side').classList.remove('open'); return; }
  if (t.dataset.r) { const k = t.dataset.r, pk = (it(cur).peek ||= {}); if (pk[k]) { pk[k] = false; renderReveals(); persist(); return; } if (k === 'hint') { pk.hint = true; persist(); renderReveals(); } else { askingFor = k; renderReveals(); } return; }
  if (t.id === 'yesReveal') { const pk = (it(cur).peek ||= {}); pk[askingFor] = true; if (askingFor === 'sol') pk.idea = true; askingFor = null; persist(); renderReveals(); return; }
  if (t.id === 'noReveal') { askingFor = null; renderReveals(); return; }
  if (t.matches('#tabs .tab')) { if (t.dataset.l !== lang) { it(cur).code[lang] = cm.getValue(); lang = t.dataset.l; store.ui.lang = lang; persist(); renderTabs(); mountEditor(); $('#results').innerHTML = '<p class="msg">بدّلتِ اللغة. اضغطي تشغيل الاختبارات.</p>'; } return; }
  if (t.id === 'runBtn') { runTests(); return; }
  if (t.id === 'resetBtn') { const p = PBY[cur]; cm.setValue(p.stubs[lang] || ''); toast('رجعت للكود الأولي'); return; }
  if (t.closest('#stSeg')) { const i = it(cur); i.status = t.dataset.s; if (solved(i.status) && !i.solvedAt) i.solvedAt = today(); persist(); syncTrack(); renderList(); return; }
  if (t.closest('#confSeg')) { it(cur).conf = +t.dataset.c; persist(); syncTrack(); return; }
  if (t.id === 'prevBtn') { openProblem(Math.max(1, cur - 1)); return; }
  if (t.id === 'nextBtn') { openProblem(Math.min(P.length, cur + 1)); return; }
  if (t.id === 'sheetBtn') { const tsv = sheetTsv(); const ok = await copyText(tsv); if (ok) toast('نسختُ 100 صف. الصقيها في الشيت عند الخلية I2 (صفحة Problems)'); else dialog('الصقي هذا في الشيت عند الخلية I2', tsv, true); return; }
  if (t.id === 'backupBtn') {
    dialog('النسخ الاحتياطي', JSON.stringify(store), false, (v) => { try { const o = JSON.parse(v); if (!o || typeof o !== 'object' || !o.items) throw 0; store = o; persist(); renderList(); openProblem(cur); toast('تم الاستيراد'); } catch (er) { toast('نص غير صالح'); return false; } }, 'استيراد النص الملصق');
    return;
  }
  if (t.closest('#diffChips')) { const d = t.dataset.d; filters.diff.has(d) ? filters.diff.delete(d) : filters.diff.add(d); t.setAttribute('aria-pressed', String(filters.diff.has(d))); renderList(); return; }
  if (t.closest('#stChips')) { const d = t.dataset.s; filters.st.has(d) ? filters.st.delete(d) : filters.st.add(d); t.setAttribute('aria-pressed', String(filters.st.has(d))); renderList(); return; }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { filters.q = e.target.value.trim().toLowerCase(); renderList(); }
  if (e.target.id === 'notes') { it(cur).notes = e.target.value; persist(); touchTimer(); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'patSel') { filters.pat = e.target.value; renderList(); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#overlay').innerHTML = ''; $('#side').classList.remove('open'); } });

/* ====================== البداية ====================== */
$('#patSel').innerHTML = '<option value="">كل الأنماط</option>' + DATA.patterns.map((p) => `<option value="${esc(p.key)}">${esc(p.key)} — ${esc(p.ar)}</option>`).join('');
renderList();
const startId = store.ui && PBY[store.ui.cur] ? store.ui.cur : 1;
openProblem(startId);

/* أدوات الاختبار الذاتي (للتحقق من أن الاختبارات تقبل الحلول المرجعية) */
window.__selfTest = async function (ids) {
  const out = [];
  for (const p of P) {
    if (ids && !ids.includes(p.id)) continue;
    if (!p.cases.length && p.spec.kind !== 'jscustom') continue;
    try {
      let res;
      if (p.spec.kind === 'sql') res = await runSql(p, p.code);
      else if (p.spec.kind === 'jscustom') res = await Runner.call('js', { pid: p.id, spec: p.spec, cases: [], code: (window.__jsRefs || {})[p.id] || p.code }, 10000);
      else if (window.__selfLang === 'js') { const ref = (window.__jsRefs || {})[p.id]; if (!ref) continue; res = await Runner.call('js', { pid: p.id, spec: p.spec, cases: p.cases, code: ref }, 10000); }
      else res = await Runner.call('py', { payload: JSON.stringify({ code: p.code, spec: p.spec, cases: p.cases }) }, 60000);
      const bad = res.results.filter((r) => !r.ok);
      out.push({ id: p.id, title: p.title, ok: !res.fatal && !bad.length, total: res.results.length, fatal: res.fatal, bad: bad.slice(0, 2) });
    } catch (e) { out.push({ id: p.id, title: p.title, ok: false, fatal: e.message }); }
  }
  return out;
};
</script>
